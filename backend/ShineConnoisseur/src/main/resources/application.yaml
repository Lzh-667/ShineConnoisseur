server:
  port: 8080
spring:
  output:
    ansi:
      enabled: always
  application:
    name: shineconnoisseur
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shineconnoisseur}?useUnicode=true&characterEncoding=utf8&autoReconnect=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/shine}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 1s
    template:
      retry:
        enabled: true # 开启超时重试机制
        initial-interval: 1000ms # 失败后的初始等待时间
        multiplier: 1 # 失败后下次的等待时长倍数，下次等待时长 = initial-interval * multiplier
        max-attempts: 3 # 最大重试次数



  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20
          max-idle: 20
          min-idle: 5
          time-between-eviction-runs: 10s

  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  type-aliases-package: com.lzh.po # 别名扫描包
logging:
  level:
    com.lzh: debug

file:
  base-path: ${FILE_BASE_PATH:D:/JavaProgram/ShineConnoisseur/backend/ShineConnoisseur/uploads/}
springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs


alipay:
  # 支付宝沙箱应用 APPID
  app-id: ${ALIPAY_APP_ID:}
  # 支付宝商户 PID，用于校验回调收款方
  seller-id: ${ALIPAY_SELLER_ID:}
  # 应用私钥
  app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
  # 支付宝公钥
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # 支付宝沙箱网关
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # RSA2
  sign-type: RSA2
  # 编码
  charset: UTF-8
  # 数据格式
  format: json
  # 支付宝异步通知地址
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 支付成功后同步跳转地址
  return-url: ${ALIPAY_RETURN_URL:}

wechat:
  pay:
    app-id: ${WECHAT_APP_ID:}
    merchant-id: ${WECHAT_MERCHANT_ID:}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
    merchant-serial-number: ${WECHAT_MERCHANT_SERIAL_NUMBER:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    notify-url: ${WECHAT_NOTIFY_URL:}
